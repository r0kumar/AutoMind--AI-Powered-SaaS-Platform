services:
  - type: web
    name: automind-ai-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install && pnpm --filter backend run build && pnpm --filter backend run db:push
    startCommand: pnpm --filter backend run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: automind-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"

databases:
  - name: automind-db
    plan: free
    region: oregon
    databaseName: automind
    user: automind
